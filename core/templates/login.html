<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BachataAI — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      background: #171b22;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-card {
      width: 340px;
      background: #20252e;
      border: 1px solid #343b47;
      border-radius: 4px;
      padding: 32px;
    }

    .login-card::before {
      content: '';
      display: block;
      height: 2px;
      background: linear-gradient(90deg, #ff8800, #cc6600);
      margin: -32px -32px 28px;
      border-radius: 4px 4px 0 0;
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 0.58rem;
      font-weight: 600;
      color: #878c95;
      margin-bottom: 6px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #343b47;
      border-radius: 4px;
      font-size: 0.72rem;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      outline: none;
      background: #1b2028;
      color: #d1d4dc;
      transition: border-color 0.2s;
    }
    input::placeholder { color: #545862; }
    input:focus { border-color: #ff8800; }

    .btn {
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      background: #20252e;
      color: #fff;
      border: 1px solid #343b47;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 600;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      cursor: pointer;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.2s, border-color 0.2s;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    }
    .btn:hover { background: #272d37; border-color: #545862; }
    .btn:active { background: #252b35; }

    .error {
      background: rgba(224,64,64,0.1);
      color: #ef4444;
      font-size: 0.65rem;
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 16px;
      border: 1px solid rgba(224,64,64,0.2);
    }
  </style>
</head>
<body>
  <div class="login-card">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="..." required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="..." required>
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>
  </div>
</body>
</html>
