<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paso — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-card {
      width: 340px;
      background: #ffffff;
      border: 1px solid #d8dae0;
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    .login-card::before {
      content: '';
      display: block;
      height: 2px;
      background: linear-gradient(90deg, #ff8800, #e67a00);
      margin: -32px -32px 28px;
      border-radius: 8px 8px 0 0;
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: #5a5d6b;
      margin-bottom: 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d8dae0;
      border-radius: 6px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      background: #ffffff;
      color: #1a1a2e;
      transition: border-color 0.2s;
    }
    input::placeholder { color: #9a9da8; }
    input:focus { border-color: #ff8800; }

    .btn {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      background: #ff8800;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: background 0.2s;
      box-shadow: 0 1px 3px rgba(255,136,0,0.3);
    }
    .btn:hover { background: #e67a00; }
    .btn:active { background: #cc6e00; }

    .error {
      background: rgba(224,64,64,0.08);
      color: #e04040;
      font-size: 0.8rem;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      border: 1px solid rgba(224,64,64,0.15);
    }
  </style>
</head>
<body>
  <div class="login-card">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="..." required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="..." required>
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>
  </div>
</body>
</html>
