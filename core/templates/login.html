<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paso — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(ellipse at 25% 15%, rgba(170, 165, 158, 0.2) 0%, transparent 50%),
        radial-gradient(ellipse at 75% 85%, rgba(155, 150, 142, 0.18) 0%, transparent 50%),
        #c8c5c0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-card {
      width: 360px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 20px;
      padding: 36px;
      box-shadow:
        0 16px 48px rgba(0, 0, 0, 0.08),
        0 4px 16px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .login-card::before {
      content: '';
      display: block;
      height: 3px;
      background: linear-gradient(90deg, #ff8800, #e67a00);
      margin: -36px -36px 28px;
      border-radius: 20px 20px 0 0;
    }

    .login-title {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 24px;
      letter-spacing: 0.02em;
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: #4a4d5c;
      margin-bottom: 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      background: rgba(255, 255, 255, 0.5);
      color: #1a1a2e;
      transition: all 0.2s;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.04);
    }
    input::placeholder { color: #8a8d9c; }
    input:focus {
      border-color: #ff8800;
      box-shadow: 0 0 0 3px rgba(255, 136, 0, 0.1);
    }

    .btn {
      width: 100%;
      padding: 11px;
      margin-top: 8px;
      background: #ff8800;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(255, 136, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .btn:hover { background: #e67a00; box-shadow: 0 6px 16px rgba(255, 136, 0, 0.25); }
    .btn:active { background: #cc6e00; transform: translateY(1px); }

    .error {
      background: rgba(224, 64, 64, 0.1);
      color: #e04040;
      font-size: 0.8rem;
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid rgba(224, 64, 64, 0.15);
    }
  </style>
</head>
<body>
  <div class="login-card">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="..." required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="..." required>
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>
  </div>
</body>
</html>
