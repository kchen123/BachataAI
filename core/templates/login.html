<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paso — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(ellipse at 25% 15%, rgba(170, 165, 158, 0.2) 0%, transparent 50%),
        radial-gradient(ellipse at 75% 85%, rgba(155, 150, 142, 0.18) 0%, transparent 50%),
        #c8c5c0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-card {
      width: 340px;
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      padding: 40px 32px 32px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.08),
        0 4px 16px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .login-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .login-logo {
      color: #ff8800;
      filter: drop-shadow(0 1px 3px rgba(255, 136, 0, 0.25));
    }

    .login-title {
      font-size: 20px;
      font-weight: 700;
      color: #ff8800;
      letter-spacing: 0.06em;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 0.65rem;
      font-weight: 600;
      color: #6a6d7c;
      margin-bottom: 6px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 12px;
      font-size: 0.85rem;
      font-family: inherit;
      outline: none;
      background: rgba(255, 255, 255, 0.55);
      color: #1a1a2e;
      transition: all 0.2s;
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.03),
        0 1px 0 rgba(255, 255, 255, 0.5);
    }
    input::placeholder { color: #aaa; }
    input:focus {
      border-color: rgba(255, 136, 0, 0.4);
      background: rgba(255, 255, 255, 0.7);
      box-shadow:
        inset 0 2px 4px rgba(0, 0, 0, 0.02),
        0 0 0 3px rgba(255, 136, 0, 0.08);
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: linear-gradient(135deg, #ff9500, #ff7800);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: all 0.2s;
      box-shadow:
        0 4px 14px rgba(255, 136, 0, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }
    .btn:hover {
      background: linear-gradient(135deg, #ff8800, #e67000);
      box-shadow: 0 6px 20px rgba(255, 136, 0, 0.3);
      transform: translateY(-1px);
    }
    .btn:active {
      background: linear-gradient(135deg, #e67a00, #cc6800);
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(255, 136, 0, 0.2);
    }

    .error {
      background: rgba(224, 64, 64, 0.08);
      color: #d03030;
      font-size: 0.78rem;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 18px;
      border: 1px solid rgba(224, 64, 64, 0.1);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <svg class="login-logo" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.73 2.1a3 3 0 0 1 4.16.88l.17.28a3 3 0 0 1-.88 4.15l-6.36 4.07a3 3 0 0 1-4.16-.88l-.17-.28a3 3 0 0 1 .88-4.15z"/><path d="M17.64 13.37a3 3 0 0 1 4.16.88l.17.28a3 3 0 0 1-.88 4.15l-6.36 4.07a3 3 0 0 1-4.16-.88l-.17-.28a3 3 0 0 1 .88-4.15z"/></svg>
      <span class="login-title">PASO</span>
    </div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="..." required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="..." required>
      </div>
      <button type="submit" class="btn">Sign in</button>
    </form>
  </div>
</body>
</html>
