<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}BachataAI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-text">Bachata AI</span>
    </div>
    <div class="nav-section-label">Studio</div>
    <a href="/" class="nav-link {% if request.path == '/' or request.path == '/videos' %}active{% endif %}">
      <span class="nav-icon">&#9654;</span> Videos
    </a>
  </nav>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
