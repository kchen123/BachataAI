{% extends "base.html" %}
{% block title %}Analysis — BachataAI{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 id="video-title">Analysis</h1>
    <p class="subtitle" id="video-meta"></p>
  </div>
  <a href="/videos" class="btn btn-secondary">&#8592; Back</a>
</div>

<div id="no-analysis" class="empty-state hidden">
  <p>No analysis yet for this video.</p>
  <button id="run-analysis-btn" class="btn btn-primary">Run Pose Analysis</button>
  <div id="analysis-progress" class="hidden" style="margin-top: 20px;">
    <p id="analysis-status" style="color: var(--warning);">Processing...</p>
  </div>
</div>

<div id="analysis-content" class="hidden">
  <!-- Row 1: Video + Summary -->
  <div class="analysis-layout">
    <div class="analysis-panel">
      <h2>Video + Skeleton</h2>
      <div class="player-container">
        <video id="video-player" controls>
          <source id="video-source" src="" type="video/mp4">
        </video>
        <canvas id="skeleton-canvas"></canvas>
      </div>
      <div class="frame-scrubber">
        <input type="range" id="frame-slider" min="0" max="100" value="0">
        <div class="frame-info">
          <span id="frame-num">Frame 0</span>
          <span id="frame-time">0.00s</span>
        </div>
      </div>
    </div>

    <div class="analysis-panel">
      <h2>Summary</h2>
      <div id="summary-grid" class="summary-grid"></div>
    </div>
  </div>

  <!-- Row 2: Charts (full width) -->
  <div class="analysis-layout" style="margin-top: 24px;">
    <div class="analysis-panel analysis-full">
      <h2>Joint Angles Over Time</h2>
      <div class="angle-selector" id="angle-selector"></div>
      <div class="chart-container">
        <canvas id="angle-chart"></canvas>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/player.js') }}"></script>
<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
<script>
const VIDEO_ID = {{ video_id }};

document.addEventListener("DOMContentLoaded", async () => {
  const video = document.getElementById("video-player");
  const noAnalysis = document.getElementById("no-analysis");
  const analysisContent = document.getElementById("analysis-content");
  const titleEl = document.getElementById("video-title");
  const metaEl = document.getElementById("video-meta");

  const vRes = await fetch(`/api/videos/${VIDEO_ID}`);
  if (!vRes.ok) return;
  const videoData = await vRes.json();
  titleEl.textContent = videoData.original_name;
  metaEl.textContent = `${videoData.fps} fps | ${videoData.frame_count} frames | ${Math.round(videoData.duration_sec)}s`;
  document.getElementById("video-source").src = videoData.gcs_url || `/uploads/${videoData.filename}`;
  video.load();

  const aRes = await fetch(`/api/videos/${VIDEO_ID}/analysis`);
  if (!aRes.ok || (await aRes.clone().json()).status !== "done") {
    noAnalysis.classList.remove("hidden");
    const btn = document.getElementById("run-analysis-btn");
    const statusEl = document.getElementById("analysis-status");
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "Starting...";
      document.getElementById("analysis-progress").classList.remove("hidden");
      await fetch(`/api/videos/${VIDEO_ID}/analyze`, { method: "POST" });
      const poll = setInterval(async () => {
        const r = await fetch(`/api/videos/${VIDEO_ID}/analysis`);
        if (r.ok) {
          const a = await r.json();
          if (a.status === "done") { clearInterval(poll); location.reload(); }
          else if (a.status === "error") { clearInterval(poll); statusEl.textContent = "Error"; btn.disabled = false; btn.textContent = "Retry"; }
          else { statusEl.textContent = "Processing frames..."; }
        }
      }, 2000);
    });
    return;
  }

  const analysis = (await aRes.json());
  analysisContent.classList.remove("hidden");

  const sp = SkeletonPlayer({
    video,
    canvas: document.getElementById("skeleton-canvas"),
    slider: document.getElementById("frame-slider"),
    frameNumEl: document.getElementById("frame-num"),
    frameTimeEl: document.getElementById("frame-time"),
    summaryGrid: document.getElementById("summary-grid"),
  });
  await sp.loadAnalysis(analysis.id, analysis.summary);

  const ac = AngleChartController(
    document.getElementById("angle-chart"),
    document.getElementById("angle-selector"),
  );
  await ac.loadAngles(analysis.id);
});
</script>
{% endblock %}
