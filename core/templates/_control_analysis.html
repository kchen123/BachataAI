<div class="analysis-container">
  <div class="analysis-section">
    <h3>Move Matching</h3>
    <p class="analysis-desc">Select a video, pick a time range, and find similar moves across your library.</p>

    <div class="analysis-row">
      <div class="analysis-field">
        <label>Video</label>
        <select id="analysisVideo" onchange="onAnalysisVideoChange()">
          <option value="">Select a video...</option>
        </select>
      </div>
      <div class="analysis-field">
        <label>Time Range</label>
        <div class="analysis-range">
          <input type="number" id="analysisStart" placeholder="0.0" step="0.1" min="0" style="width:70px" onchange="validateRange()"> s
          <span>&mdash;</span>
          <input type="number" id="analysisEnd" placeholder="5.0" step="0.1" min="0" style="width:70px" onchange="validateRange()"> s
        </div>
      </div>
      <div class="analysis-field" style="align-self:flex-end">
        <button class="btn btn-sm btn-accent" id="analysisSearchBtn" onclick="runMoveSearch()" disabled>Find Similar</button>
      </div>
    </div>

    <div class="analysis-preview" id="analysisPreview">
      <video id="analysisPlayer" controls style="max-height:200px;border-radius:8px;width:100%"></video>
    </div>

    <div class="analysis-status" id="analysisStatus"></div>

    <div id="analysisResults"></div>
  </div>

  <div class="analysis-section">
    <h3>Feature Index</h3>
    <p class="analysis-desc">Compute pose features for all analyzed videos to enable matching.</p>
    <button class="btn btn-sm" id="backfillBtn" onclick="runBackfill()">Compute All Features</button>
    <span class="analysis-status" id="backfillStatus"></span>
  </div>
</div>
