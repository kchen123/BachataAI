<div class="analysis-container">

  <!-- Step 1: Pick a video -->
  <div class="analysis-step">
    <div class="analysis-step-num">1</div>
    <div class="analysis-step-body">
      <label class="analysis-label">Select a video</label>
      <select id="analysisVideo" onchange="onAnalysisVideoChange()">
        <option value="">Choose...</option>
      </select>
    </div>
  </div>

  <!-- Step 2: Select range (shown after video picked) -->
  <div class="analysis-step hidden" id="analysisStep2">
    <div class="analysis-step-num">2</div>
    <div class="analysis-step-body" style="flex:1;min-width:0">
      <label class="analysis-label">Select a move</label>
      <div class="analysis-player-wrap">
        <video id="analysisPlayer" controls></video>
      </div>
      <div class="analysis-timeline-wrap">
        <span class="analysis-time" id="analysisTimeStart">0:00</span>
        <div class="analysis-timeline" id="analysisTimeline">
          <div class="analysis-timeline-track"></div>
          <div class="analysis-timeline-sel" id="analysisTimelineSel"></div>
          <div class="analysis-handle analysis-handle-l" id="analysisHandleL"></div>
          <div class="analysis-handle analysis-handle-r" id="analysisHandleR"></div>
        </div>
        <span class="analysis-time" id="analysisTimeEnd">0:00</span>
      </div>
      <div class="analysis-range-info">
        <span id="analysisRangeLabel">Drag the handles to select a range</span>
        <button class="btn btn-sm btn-accent" id="analysisSearchBtn" onclick="runMoveSearch()" disabled>Find Similar</button>
      </div>
    </div>
  </div>

  <!-- Step 3: Results -->
  <div class="analysis-step hidden" id="analysisStep3">
    <div class="analysis-step-num">3</div>
    <div class="analysis-step-body" style="flex:1;min-width:0">
      <label class="analysis-label">Matches</label>
      <div class="analysis-status" id="analysisStatus"></div>
      <div id="analysisResults"></div>
    </div>
  </div>

  <!-- Footer: backfill -->
  <div class="analysis-footer">
    <button class="btn btn-sm" id="backfillBtn" onclick="runBackfill()">Reindex All Videos</button>
    <span class="analysis-status" id="backfillStatus"></span>
  </div>

</div>
