<div class="config-container">
  <div class="admin-section">
    <div class="admin-section-header">
      <h3>Global Configs</h3>
      <button class="btn btn-sm" onclick="openConfigModal()">+ New</button>
    </div>
    <table class="admin-table" id="configsTable">
      <thead><tr><th>Key</th><th>Updated</th><th style="width:60px"></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Edit Config Modal -->
<div class="modal-overlay" id="configModal">
  <div class="files-modal" style="max-width:700px;max-height:85vh;display:flex;flex-direction:column">
    <h3 id="configModalTitle" style="margin-bottom:8px">Edit Config</h3>
    <div style="margin-bottom:8px">
      <label class="admin-field"><span>Key</span>
        <input type="text" id="editConfigKey" placeholder="config_name" style="width:100%">
      </label>
    </div>
    <textarea class="pose-config-editor" id="editConfigValue" spellcheck="false" style="flex:1;min-height:300px"></textarea>
    <div class="pose-config-status" id="configModalStatus"></div>
    <div class="files-modal-actions" style="margin-top:8px">
      <button class="btn btn-sm" onclick="closeConfigModal()">Cancel</button>
      <span style="flex:1"></span>
      <button class="btn btn-sm" style="color:var(--red);border-color:var(--red)" id="btnDeleteConfig" onclick="confirmDeleteConfig()" style="display:none">Delete</button>
      <button class="btn btn-sm btn-accent" onclick="saveConfig()">Save</button>
    </div>
  </div>
</div>

<!-- Delete Confirm -->
<div class="modal-overlay" id="deleteConfigModal">
  <div class="files-modal" style="max-width:360px">
    <h3 style="margin-bottom:12px">Delete this config?</h3>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px">This cannot be undone.</p>
    <div class="files-modal-actions">
      <button class="btn btn-sm" onclick="closeDeleteConfigModal()">Cancel</button>
      <button class="btn btn-sm" style="color:var(--red);border-color:var(--red)" onclick="doDeleteConfig()">Delete</button>
    </div>
  </div>
</div>
