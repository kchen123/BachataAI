<div class="pose-config-container">
  <div class="pose-config-header">
    <h3>Pose Estimation Config</h3>
    <div class="pose-config-actions">
      <button class="btn btn-sm" onclick="loadPoseConfig()">Reload</button>
      <button class="btn btn-sm btn-accent" onclick="savePoseConfig()">Save</button>
    </div>
  </div>
  <div class="pose-config-status" id="poseConfigStatus"></div>
  <textarea class="pose-config-editor" id="poseConfigEditor" spellcheck="false"></textarea>
</div>
